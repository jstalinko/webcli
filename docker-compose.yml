version: '3.8'

services:
  webcli:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: webcli-ide
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - PORT=3000
      - HOST=0.0.0.0
      - NODE_ENV=production
      - JWT_SECRET=change-this-secure-jwt-secret-in-production-random-cyber-key-999
      - JWT_EXPIRES_IN=7d
      - DATA_DIR=/app/data
      - WORKSPACES_ROOT=/app/workspaces
    volumes:
      - webcli-data:/app/data
      - webcli-workspaces:/app/workspaces
    # Resource constraints for container isolation
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          cpus: '0.5'
          memory: 512M

volumes:
  webcli-data:
    driver: local
  webcli-workspaces:
    driver: local
